[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloak"
version = "0.2.0"
description = "A modern multi-format steganography CLI & TUI tool that hides encrypted messages and binary files in PNG images and WAV audio."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Lovaszy Leonard", email = "leonardlovaszy@gmail.com"}
]
keywords = [
    "steganography",
    "lsb",
    "encryption",
    "aes-256-gcm",
    "security",
    "privacy",
    "png",
    "wav",
    "cli",
    "tui",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "Pillow",
    "rich",
    "questionary",
    "pyfiglet",
    "cryptography",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pyinstaller>=6.0",
    "build>=1.0",
]

[project.urls]
Homepage = "https://github.com/LovaszyLeonard/cloak"
Repository = "https://github.com/LovaszyLeonard/cloak.git"
Issues = "https://github.com/LovaszyLeonard/cloak/issues"

[project.scripts]
cloak = "stego.__main__:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
