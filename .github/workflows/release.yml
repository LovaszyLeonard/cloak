name: Release & Packaging

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-binaries:
    name: Build Standalone Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: cloak
            asset_name: cloak-linux-x86_64
          - os: windows-latest
            artifact_name: cloak.exe
            asset_name: cloak-windows-x86_64.exe
          - os: macos-latest
            artifact_name: cloak
            asset_name: cloak-macos-arm64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip install -e .

      - name: Build Standalone Executable
        run: pyinstaller cloak.spec

      - name: Prepare Binary Asset (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x dist/${{ matrix.artifact_name }}
          cp dist/${{ matrix.artifact_name }} ${{ matrix.asset_name }}

      - name: Prepare Binary Asset (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cp dist/${{ matrix.artifact_name }} ${{ matrix.asset_name }}

      - name: Upload Binary to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pypi:
    name: Build & Publish to PyPI
    needs: [build-binaries]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build Source Distribution & Wheel
        run: python -m build

      - name: Publish Distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
